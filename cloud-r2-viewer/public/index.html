<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09051D" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>TRẠM TINH HÀ • Lưu Ảnh Kỷ Niệm</title>
  <link rel="icon" type="image/png" sizes="64x64" href="./assets/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Outfit:wght@500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-deep: #07041A;
      --glass-bg: rgba(13, 8, 40, 0.78);
      --glass-bg-hover: rgba(24, 15, 68, 0.9);
      --glass-border: rgba(167, 139, 250, 0.28);
      --text-pure: #F8FAFF;
      --text-muted: #B6BCE0;
      --emerald-1: #10B981;
      --emerald-2: #059669;
      --cyan-1: #38BDF8;
      --violet-1: #818CF8;
      --font-main: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-heading: "Outfit", "Be Vietnam Pro", sans-serif;
      --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace;
      --top-pad: max(4px, env(safe-area-inset-top));
      --bottom-pad: max(4px, env(safe-area-inset-bottom));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      background-color: var(--bg-deep);
      color: var(--text-pure);
      font-family: var(--font-main);
      position: fixed;
      top: 0;
      left: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    .cosmos-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: url('./assets/bg-portrait.jpg');
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      pointer-events: none;
    }

    @media (orientation: landscape) and (min-width: 768px) {
      .cosmos-bg {
        background-image: url('./assets/bg-landscape.jpg');
      }
    }

    .cosmos-vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(circle at 50% 48%, rgba(8, 4, 26, 0.34) 0%, rgba(6, 3, 20, 0.78) 100%),
        linear-gradient(180deg, rgba(10, 5, 34, 0.52) 0%, rgba(8, 4, 26, 0.14) 45%, rgba(6, 3, 20, 0.72) 100%);
      pointer-events: none;
    }

    .viewer-shell {
      position: relative;
      z-index: 2;
      height: 100%;
      height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: var(--top-pad) 6px var(--bottom-pad);
      gap: 3px;
    }

    /* 1. Ultra-Compact Header: Logo + Chào Tân Sinh Viên 2026 + TRẠM TINH HÀ */
    .viewer-top-bar {
      flex-shrink: 0;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 3px 8px 3px 6px;
      min-height: 36px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(3, 1, 16, 0.45);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      flex: 1;
    }

    .brand-logo-badge {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #FFFFFF;
      padding: 1px;
      flex-shrink: 0;
      box-shadow: 0 0 10px rgba(125, 211, 252, 0.45);
      object-fit: contain;
    }

    .brand-titles {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 1px;
      min-width: 0;
      flex: 1;
    }

    .brand-chao-img {
      display: block;
      height: 8px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(196, 181, 253, 0.65));
    }

    .brand-title-img {
      display: block;
      height: 14px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.55));
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .session-badge {
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-variant-numeric: tabular-nums;
      color: #CBD5E1;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(125, 211, 252, 0.28);
      padding: 2px 6px;
      border-radius: 6px;
      max-width: 115px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .icon-btn {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-pure);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* 2. Full-Screen Photo & GIF Hero Stage - Maximized for Vertical Photo Strips */
    .photo-stage {
      position: relative;
      flex: 1 1 0%;
      min-height: 0;
      min-width: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 0;
      margin: 0;
      cursor: zoom-in;
      background: transparent !important;
      background-color: transparent !important;
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
      background: transparent !important;
      background-color: transparent !important;
    }

    .image-wrapper.zoomed {
      transform: scale(2.0);
      cursor: zoom-out;
    }

    /* Stretch both static photo AND animated GIF to 100% of available height with no artificial cap */
    .media-display {
      display: none;
      width: auto !important;
      height: 100% !important;
      max-height: 100% !important;
      max-width: min(100%, 98vw) !important;
      object-fit: contain;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      border-radius: 6px;
      filter: drop-shadow(0 14px 34px rgba(2, 1, 14, 0.94));
      transition: opacity 0.2s ease, filter 0.2s ease;
      pointer-events: auto;
      background: transparent !important;
      background-color: transparent !important;
    }

    .media-display.active {
      display: block;
    }

    .state-card {
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      padding: 20px 18px;
      border-radius: 16px;
      text-align: center;
      max-width: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: var(--cyan-1);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .state-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-pure);
    }

    .state-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* 3. Floating Bottom Control Island - Compact & Pushed Completely to Bottom */
    .viewer-dock {
      flex-shrink: 0;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      z-index: 20;
      display: none;
      flex-direction: column;
      gap: 4px;
      padding-bottom: 2px;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .viewer-dock.visible {
      display: flex;
    }

    .media-switcher {
      display: none;
      align-self: center;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      padding: 2px;
      border-radius: 999px;
      gap: 3px;
      box-shadow: 0 4px 16px rgba(3, 1, 16, 0.45);
    }

    .media-switcher.visible {
      display: flex;
    }

    .switch-pill {
      display: flex;
      align-items: center;
      gap: 4px;
      min-height: 24px;
      padding: 0 11px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.16s ease, color 0.16s ease, transform 0.12s ease;
    }

    .switch-pill:hover {
      color: var(--text-pure);
    }

    .switch-pill:active {
      transform: scale(0.96);
    }

    .switch-pill.active {
      background: linear-gradient(135deg, var(--cyan-1), var(--violet-1));
      color: #07041A;
      box-shadow: 0 2px 10px rgba(56, 189, 248, 0.35);
    }

    .action-row {
      display: flex;
      align-items: center;
      gap: 5px;
      width: 100%;
    }

    .btn-primary {
      flex: 1;
      min-height: 36px;
      padding: 6px 14px;
      border-radius: 10px;
      border: 1px solid rgba(110, 231, 183, 0.35);
      background: linear-gradient(135deg, var(--emerald-1), var(--emerald-2));
      color: #FFFFFF;
      font-size: 12.5px;
      font-weight: 750;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.32);
      transition: transform 0.12s ease, filter 0.15s ease;
    }

    .btn-primary:active {
      transform: scale(0.97);
      filter: brightness(0.92);
    }

    .btn-secondary {
      min-height: 36px;
      padding: 6px 11px;
      border-radius: 10px;
      border: 1px solid rgba(125, 211, 252, 0.42);
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: var(--cyan-1);
      font-size: 11.5px;
      font-weight: 700;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(3, 1, 16, 0.35);
    }

    .btn-icon-share {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: var(--text-pure);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.12s ease;
      box-shadow: 0 4px 12px rgba(3, 1, 16, 0.35);
    }

    .btn-icon-share:active {
      transform: scale(0.92);
    }

    .bottom-guidance {
      text-align: center;
      padding: 1px 4px 0;
      line-height: 1.2;
    }

    .guide-text {
      font-size: 9.5px;
      color: #94A3B8;
      font-weight: 500;
    }

    body.zen-mode .viewer-top-bar,
    body.zen-mode .viewer-dock {
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    @media (max-width: 390px) {
      .session-badge {
        display: none;
      }
    }

    @media (min-width: 768px) {

      .viewer-top-bar,
      .viewer-dock {
        max-width: 520px;
      }

      .brand-logo-badge {
        width: 30px;
        height: 30px;
      }

      .brand-chao-img {
        height: 9.5px;
      }

      .brand-title-img {
        height: 16px;
      }
    }
  </style>
</head>

<body>
  <div class="cosmos-bg" aria-hidden="true"></div>
  <div class="cosmos-vignette" aria-hidden="true"></div>

  <main class="viewer-shell">
    <header class="viewer-top-bar">
      <div class="brand-cluster">
        <img src="./assets/logo.png" alt="Logo Hội Sinh Viên Đất Cầu Vồng" class="brand-logo-badge" />
        <div class="brand-titles">
          <img src="./assets/chao-tsv.png" alt="CHÀO TÂN SINH VIÊN 2026" class="brand-chao-img" />
          <img src="./assets/tram-tinh-ha.png" alt="TRẠM TINH HÀ" class="brand-title-img" />
        </div>
      </div>
      <div class="header-actions">
        <span class="session-badge" id="session-badge">#--</span>
        <button type="button" class="icon-btn" id="btn-fullscreen" title="Toàn màn hình" aria-label="Toàn màn hình">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
          </svg>
        </button>
      </div>
    </header>

    <section class="photo-stage" id="stage-touch-surface">
      <div id="state-loading" class="state-card">
        <div class="spinner"></div>
        <div class="state-title" id="loading-title">Đang nhận ảnh từ buồng chụp...</div>
        <div class="state-desc" id="loading-desc">Hệ thống đang đồng bộ ảnh gốc và GIF lên đám mây (khoảng 1–3 giây).
        </div>
      </div>

      <div class="image-wrapper" id="image-wrapper" style="display:none;">
        <img id="img-photo" class="media-display active" src="" alt="Ảnh Photobooth" draggable="false" />
        <img id="img-gif" class="media-display" src="" alt="Ảnh động GIF" draggable="false" />
      </div>
    </section>

    <footer class="viewer-dock" id="action-buttons">
      <div id="media-tabs" class="media-switcher">
        <button type="button" class="switch-pill active" data-target="photo">Ảnh Khung (HD)</button>
        <button type="button" class="switch-pill" data-target="gif">Ảnh Động GIF</button>
      </div>

      <div class="action-row">
        <a id="btn-dl-photo" href="#" class="btn-primary" download>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          <span id="btn-dl-text">Lưu Ảnh Về Máy</span>
        </a>

        <a id="btn-dl-gif" href="#" class="btn-secondary" download>
          <span>Tải GIF</span>
        </a>

        <button type="button" id="btn-native-share" class="btn-icon-share" title="Chia sẻ ảnh" aria-label="Chia sẻ">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3" />
            <circle cx="6" cy="12" r="3" />
            <circle cx="18" cy="19" r="3" />
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
          </svg>
        </button>
      </div>

      <div class="bottom-guidance">
        <span class="guide-text">💡 Giữ ảnh để lưu • Chạm 2 lần để phóng to • Tự động lưu 7 ngày</span>
        <span id="footer-meta" style="display:none;"><span id="session-foot">--</span></span>
      </div>
    </footer>
  </main>

  <script>
    (function () {
      const WORKER_API_BASE = window.PHOTOBOOTH_WORKER_URL || '';
      const params = new URLSearchParams(window.location.search);
      const rawSession = params.get('s') || params.get('session') || params.get('image') || '';
      const sessionId = rawSession.replace(/\.(jpg|jpeg|png|gif)$/i, '').replace(/[^A-Za-z0-9._-]/g, '');

      const stateLoading = document.getElementById('state-loading');
      const loadingTitle = document.getElementById('loading-title');
      const loadingDesc = document.getElementById('loading-desc');
      const imageWrapper = document.getElementById('image-wrapper');
      const mediaTabs = document.getElementById('media-tabs');
      const imgPhoto = document.getElementById('img-photo');
      const imgGif = document.getElementById('img-gif');
      const sessionBadge = document.getElementById('session-badge');
      const sessionFoot = document.getElementById('session-foot');
      const footerMeta = document.getElementById('footer-meta');
      const actionButtons = document.getElementById('action-buttons');
      const btnDlPhoto = document.getElementById('btn-dl-photo');
      const btnDlText = document.getElementById('btn-dl-text');
      const btnDlGif = document.getElementById('btn-dl-gif');
      const btnNativeShare = document.getElementById('btn-native-share');
      const stageSurface = document.getElementById('stage-touch-surface');
      const fsBtn = document.getElementById('btn-fullscreen');

      let currentSessionData = null;
      let activeTab = 'photo';
      let pollCount = 0;

      if (fsBtn) {
        fsBtn.addEventListener('click', () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => document.body.classList.toggle('zen-mode'));
          } else {
            document.exitFullscreen().catch(() => { });
          }
        });
      }

      if (!sessionId) {
        loadingTitle.textContent = 'Chưa có mã phiên chụp';
        loadingDesc.textContent = 'Hãy quét mã QR hiển thị trên màn hình Photobooth sau khi chụp để mở trang lưu ảnh của bạn.';
        document.querySelector('.spinner').style.display = 'none';
        return;
      }

      sessionBadge.textContent = '#' + sessionId;
      if (sessionFoot) sessionFoot.textContent = sessionId;

      function setActiveTab(target) {
        activeTab = target;
        document.querySelectorAll('.switch-pill').forEach((b) => {
          b.classList.toggle('active', b.getAttribute('data-target') === target);
        });
        if (target === 'gif') {
          imgPhoto.classList.remove('active');
          imgGif.classList.add('active');
          btnDlText.textContent = 'Lưu Ảnh Động (GIF)';
          if (currentSessionData && currentSessionData.gif_download_url) {
            btnDlPhoto.href = currentSessionData.gif_download_url;
          }
        } else {
          imgGif.classList.remove('active');
          imgPhoto.classList.add('active');
          btnDlText.textContent = 'Lưu Ảnh Về Máy';
          if (currentSessionData && currentSessionData.photo_download_url) {
            btnDlPhoto.href = currentSessionData.photo_download_url;
          }
        }
      }

      document.querySelectorAll('.switch-pill').forEach((btn) => {
        btn.addEventListener('click', () => {
          setActiveTab(btn.getAttribute('data-target'));
        });
      });

      let lastTap = 0;
      let tapTimer = null;
      stageSurface.addEventListener('click', () => {
        const now = Date.now();
        if (now - lastTap < 300) {
          clearTimeout(tapTimer);
          imageWrapper.classList.toggle('zoomed');
        } else {
          tapTimer = setTimeout(() => {
            if (!imageWrapper.classList.contains('zoomed')) {
              document.body.classList.toggle('zen-mode');
            }
          }, 250);
        }
        lastTap = now;
      });

      let touchStartX = 0;
      stageSurface.addEventListener('touchstart', (e) => {
        if (e.touches && e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
        }
      }, { passive: true });

      stageSurface.addEventListener('touchend', (e) => {
        if (!mediaTabs.classList.contains('visible')) return;
        if (e.changedTouches && e.changedTouches.length === 1) {
          const dx = e.changedTouches[0].clientX - touchStartX;
          if (Math.abs(dx) > 50) {
            setActiveTab(dx < 0 ? 'gif' : 'photo');
          }
        }
      }, { passive: true });

      if (navigator.share) {
        btnNativeShare.style.display = 'flex';
        btnNativeShare.addEventListener('click', async () => {
          if (!currentSessionData) return;
          const isGif = activeTab === 'gif' && currentSessionData.gif_url;
          const fileUrl = isGif ? currentSessionData.gif_url : currentSessionData.photo_url;
          const fileName = isGif ? 'Photobooth_' + sessionId + '.gif' : 'Photobooth_' + sessionId + '.jpg';
          const mimeType = isGif ? 'image/gif' : 'image/jpeg';

          try {
            if (window.fetch && window.File && navigator.canShare) {
              const res = await fetch(fileUrl);
              const blob = await res.blob();
              const file = new File([blob], fileName, { type: mimeType });
              if (navigator.canShare({ files: [file] })) {
                await navigator.share({ title: 'TRẠM TINH HÀ', files: [file] });
                return;
              }
            }
            await navigator.share({ title: 'TRẠM TINH HÀ', url: window.location.href });
          } catch (e) {
            if (e.name !== 'AbortError') {
              window.location.href = isGif ? currentSessionData.gif_download_url : currentSessionData.photo_download_url;
            }
          }
        });
      }

      async function fetchSession() {
        try {
          const res = await fetch(WORKER_API_BASE + '/api/session?s=' + encodeURIComponent(sessionId) + '&_t=' + Date.now());
          const data = await res.json();
          if (data && data.ready) {
            currentSessionData = data;
            stateLoading.style.display = 'none';
            imageWrapper.style.display = 'flex';
            actionButtons.classList.add('visible');

            if (data.metadata && data.metadata.preset && footerMeta) {
              footerMeta.innerHTML = 'Phiên: <span id="session-foot">' + sessionId + '</span> • Preset: ' + data.metadata.preset;
            }

            if (data.has_photo && data.photo_url) {
              imgPhoto.src = data.photo_url;
              btnDlPhoto.href = data.photo_download_url;
              imgPhoto.classList.add('active');
            }
            if (data.has_gif && data.gif_url) {
              imgGif.src = data.gif_url;
              btnDlGif.href = data.gif_download_url;
              btnDlGif.style.display = 'flex';
              mediaTabs.classList.add('visible');
              if (params.get('tab') === 'gif') {
                setActiveTab('gif');
              }
            } else if (pollCount < 120) {
              pollCount++;
              setTimeout(checkGifUpdateSilently, 2500);
            }
            return;
          }
          pollCount++;
          if (pollCount <= 120) {
            loadingTitle.textContent = 'Đang tải ảnh gốc & GIF chất lượng cao từ buồng chụp...';
            loadingDesc.textContent = 'Bạn có thể giữ màn hình này hoặc mở lại sau ít phút (' + pollCount + '/120).';
            setTimeout(fetchSession, 2500);
          } else {
            loadingTitle.textContent = 'Chưa tìm thấy ảnh trên đám mây';
            loadingDesc.textContent = 'Phiên chụp "' + sessionId + '" chưa được đồng bộ hoặc đã hết hạn lưu trữ.';
            document.querySelector('.spinner').style.display = 'none';
          }
        } catch (err) {
          pollCount++;
          if (pollCount <= 120) {
            setTimeout(fetchSession, 2500);
          } else {
            loadingTitle.textContent = 'Không thể kết nối máy chủ';
            loadingDesc.textContent = 'Vui lòng kiểm tra kết nối 4G/WiFi và tải lại trang.';
            document.querySelector('.spinner').style.display = 'none';
          }
        }
      }

      async function checkGifUpdateSilently() {
        try {
          const res = await fetch(WORKER_API_BASE + '/api/session?s=' + encodeURIComponent(sessionId) + '&_t=' + Date.now());
          const data = await res.json();
          if (data && data.has_gif && data.gif_url) {
            currentSessionData = data;
            imgGif.src = data.gif_url;
            btnDlGif.href = data.gif_download_url;
            btnDlGif.style.display = 'flex';
            mediaTabs.classList.add('visible');
            if (params.get('tab') === 'gif') {
              setActiveTab('gif');
            }
          } else if (pollCount < 120) {
            pollCount++;
            setTimeout(checkGifUpdateSilently, 2500);
          }
        } catch (_) { }
      }

      fetchSession();
    })();
  </script>
</body>

</html>
