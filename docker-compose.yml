services:
  photobooth:
    build: .
    user: root
    ports:
      - "80:80"
      - "443:443"
    environment:
      - COMPOSER_VERSION=2
      - PHP_MEMORY_LIMIT=512M
      - PHP_MAX_EXECUTION_TIME=60
      - PHP_OPCACHE_MEMORY_CONSUMPTION=192
      - PHP_OPCACHE_MAX_ACCELERATED_FILES=10000
      - PHP_OPCACHE_REVALIDATE_FREQ=2
    volumes:
      - ./config/php-performance.ini:/usr/local/etc/php/conf.d/zz-photobooth-performance.ini:ro
      - ./data:/app/data
      - ./var:/app/var
      - ./config:/app/config
      - ./private:/app/private
      - ./api:/app/api
      - ./src:/app/src
      - ./template:/app/template
      - ./lib:/app/lib
      - ./resources:/app/resources
      - ./PresetColor:/app/PresetColor
      - ./Frame:/app/Frame
      - ./welcome:/app/welcome
      - ./scripts:/app/scripts
      - ./.htaccess:/app/.htaccess:ro
      - ./index.php:/app/index.php
      - ./view.php:/app/view.php

