services:
  photobooth:
    build: .
    ports:
      - "80:80"
      - "443:443"
    environment:
      - COMPOSER_VERSION=2
    volumes:
      - ./data:/app/data
      - ./var:/app/var
      - ./config:/app/config
      - ./private:/app/private
      - ./api:/app/api
      - ./src:/app/src
      - ./template:/app/template
      - ./lib:/app/lib
      - ./resources:/app/resources
      - ./PresetColor:/app/PresetColor
      - ./Frame:/app/Frame
      - ./welcome:/app/welcome
      - ./scripts:/app/scripts
      - ./index.php:/app/index.php
      - ./view.php:/app/view.php

